name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ramo: só o último commit interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade de código
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SESSION_SECRET: segredo-de-ci-com-mais-de-32-caracteres-ok
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários, com piso de cobertura
        run: npm run test:coverage

      - name: Diagnóstico do sistema fuzzy
        # Falha se a base de regras deixar de ser monótona, ou se o artefato de
        # inversão do centroide passar do limite documentado.
        run: npx tsx scripts/diagnostico-fuzzy.ts

      - name: Construção de produção
        run: npm run build

  integracao:
    name: Testes de integração (Postgres com pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: permaneia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      SESSION_SECRET: segredo-de-ci-com-mais-de-32-caracteres-ok
      DATABASE_URL: postgresql://ci:ci@localhost:5432/permaneia_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/permaneia_test
      IA_EXTERNA: "off"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar o esquema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Testes de integração
        run: npm run test:integration

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: permaneia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: segredo-de-ci-com-mais-de-32-caracteres-ok
      DATABASE_URL: postgresql://ci:ci@localhost:5432/permaneia_e2e
      DIRECT_URL: postgresql://ci:ci@localhost:5432/permaneia_e2e
      DEMO_MODE: "on"
      IA_EXTERNA: "off"
      E2E_PORTA: "3100"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o banco com dados sintéticos
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Construção de produção
        run: npm run build

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e

      - name: Publicar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  avaliacao-rag:
    name: Avaliação de qualidade do RAG
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: permaneia_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: segredo-de-ci-com-mais-de-32-caracteres-ok
      DATABASE_URL: postgresql://ci:ci@localhost:5432/permaneia_rag
      DIRECT_URL: postgresql://ci:ci@localhost:5432/permaneia_rag
      IA_EXTERNA: "off"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Preparar o banco e indexar os documentos
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Medir cobertura e recusa do assistente
        # Informativo: publica os números a cada commit para que uma queda de
        # qualidade do RAG apareça no histórico. Quem barra a integração são os
        # outros trabalhos. Ver docs/AVALIACAO-RAG.md.
        continue-on-error: true
        run: npx tsx scripts/avaliar-rag.ts

  seguranca:
    name: Análise de segurança
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Auditoria de dependências de produção
        # Falha apenas em vulnerabilidade de produção de severidade alta. As de
        # desenvolvimento não embarcam no artefato publicado.
        run: npm run audit:prod -- --audit-level=high

      - name: Análise estática
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/nextjs
            p/owasp-top-ten
            p/sql-injection
            p/xss
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  manifestos:
    name: Conferência dos manifestos e da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o leitor de YAML
        run: pip install pyyaml

      - name: Conferir os manifestos do Kubernetes
        # Pega o que nenhuma validação de esquema pega: alvo de escala que não
        # existe, seletor que não acha pod, chave de segredo não declarada,
        # volume montado sem ter sido criado. Tudo isso passa no apply sem uma
        # linha de erro, e o sintoma aparece como "não tem nada respondendo".
        run: python k8s/conferir-manifestos.py

      - name: Construir a imagem
        # A imagem existe para o sistema não depender de uma plataforma só, e
        # imagem que ninguém constrói apodrece em silêncio: o Dockerfile
        # quebra numa mudança de dependência e só se descobre no dia em que
        # alguém precisa dele.
        run: |
          docker build \
            --build-arg APP_COMMIT="${{ github.sha }}" \
            --build-arg APP_RAMO="${{ github.ref_name }}" \
            -t permaneia:ci .

      - name: Conferir que a imagem sobe e responde
        run: |
          # Sem banco, o health responde 503 com "banco": "indisponivel", e é
          # exatamente o que se quer conferir aqui: que o processo subiu, que a
          # rota existe e que a degradação é a projetada. Um 200 aqui seria
          # notícia ruim, porque significaria health que não olha o banco.
          docker run -d --name permaneia-ci -p 3000:3000 \
            -e DATABASE_URL="postgresql://ninguem:ninguem@127.0.0.1:1/vazio" \
            -e DIRECT_URL="postgresql://ninguem:ninguem@127.0.0.1:1/vazio" \
            -e SESSION_SECRET="segredo-de-ci-com-mais-de-32-caracteres-ok" \
            permaneia:ci

          for tentativa in $(seq 1 30); do
            codigo=$(curl -s -o /tmp/saude.json -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$codigo" = "200" ] || [ "$codigo" = "503" ]; then
              echo "A imagem respondeu $codigo na tentativa $tentativa."
              cat /tmp/saude.json
              docker rm -f permaneia-ci > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::A imagem não respondeu em sessenta segundos."
          docker logs permaneia-ci
          docker rm -f permaneia-ci > /dev/null
          exit 1
