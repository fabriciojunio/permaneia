name: Manter o banco acordado

# Existe por causa de uma perda real: o projeto do Supabase, onde este sistema
# morava, PAUSOU sozinho depois de sete dias sem conexão e sumiu do DNS, e
# despausar era manual, pelo painel. O sintoma foi a página inicial respondendo
# 200 com o assistente e o painel quebrados, porque página respondendo não prova
# banco.
#
# O banco hoje é o Neon, que não pausa: o compute suspende e acorda sozinho na
# conexão seguinte, em cerca de meio segundo. Esta visita diária continua
# valendo por dois motivos menores e reais: mantém o compute quente, para quem
# abrir o link não pagar nem essa espera, e é um monitor de fumaça diário que
# avisa quando alguma coisa do caminho até o banco quebrou.
#
# Não é o mesmo problema do plano gratuito da Vercel: a função serverless não
# hiberna, ela sobe a frio em milissegundos. Quem dorme aqui é o banco.
#
# Agendamento na camada gratuita do GitHub é promessa, não garantia: já medimos
# atraso de horas em outro repositório. Uma vez por dia contra uma janela de
# sete dias tem margem de sobra para aguentar isso.

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

concurrency:
  group: manter-banco-acordado
  cancel-in-progress: false

jobs:
  visitar:
    name: Uma consulta por dia
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Acordar o banco pelo health
        env:
          PRODUCAO_URL: ${{ vars.PRODUCAO_URL || 'https://permaneia.vercel.app' }}
        run: |
          # O /api/health é o caminho certo porque ele CONSULTA o banco de
          # verdade, e não só confirma que o processo subiu. Bater na página
          # inicial não abriria conexão nenhuma, e o banco dormiria do mesmo
          # jeito enquanto o fluxo ficava verde todo dia.
          corpo=$(curl -s --max-time 60 "$PRODUCAO_URL/api/health" || true)
          estado=$(printf '%s' "$corpo" | sed -n 's/.*"banco":"\([^"]*\)".*/\1/p')

          echo "Banco: ${estado:-sem resposta}"

          if [ "$estado" != "ok" ]; then
            # Aviso, e não falha: este fluxo é conveniência, e e-mail de erro
            # todo dia vira ruído que ninguém lê. Quem cobra a saúde do sistema
            # é o fluxo de conferência da publicação.
            echo "::warning::O banco respondeu '${estado:-nada}'. Confira o projeto no painel do Neon e a validade das credenciais na Vercel."
          fi
