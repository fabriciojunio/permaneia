---
# Aplica o esquema uma vez, antes da aplicação subir.
#
# Separado do arranque da aplicação de propósito: migração disparada por réplica
# que sobe é migração disparada N vezes em paralelo, e o resultado depende de
# quem chegou primeiro. Um Job roda uma vez e falha visivelmente quando falha.
apiVersion: batch/v1
kind: Job
metadata:
  name: permaneia-esquema
  namespace: permaneia
spec:
  backoffLimit: 3
  # Sai da lista sozinho um dia depois. Sem isto, cada publicação deixa um Job
  # concluído para trás e a listagem vira um cemitério.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # 1000, e não 1001: é o usuário `node` da imagem base, que é dono dos
        # arquivos na imagem de manutenção. A de execução usa 1001, que é o
        # usuário criado lá.
        runAsUser: 1000
      containers:
        - name: esquema
          # A imagem de MANUTENÇÃO, construída do estágio `ferramentas`. A de
          # execução não tem o CLI do Prisma: o pacote autocontido do Next só
          # leva o que o servidor usa para atender.
          image: ghcr.io/fabriciojunio/permaneia-ferramentas:v1.0.0
          # `db push` e não `migrate deploy`: a extensão vector precisa existir
          # antes, e este é o mesmo caminho que o CI e o compose usam.
          command: ["node_modules/.bin/prisma", "db", "push", "--skip-generate"]
          env:
            # A conexão direta nas duas: aplicar esquema pelo pooler falha em
            # comando que precisa de sessão, e o erro que aparece fala de
            # transação preparada, que não ajuda ninguém a achar a causa.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: permaneia-banco
                  key: direct-url
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: permaneia-banco
                  key: direct-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
